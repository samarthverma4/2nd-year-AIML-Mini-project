<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing — Cartoon Care</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .pricing-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }
    .pricing-head { text-align: center; margin-bottom: 3rem; }
    .pricing-head h1 { font-size: 2.6rem; margin-bottom: .75rem; }
    .pricing-head p { color: var(--muted-fg); font-size: 1.1rem; }

    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      align-items: stretch;
    }
    .plan-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 20px rgba(124, 58, 237, .06);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .plan-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(124, 58, 237, .12); }
    .plan-card.featured {
      border-color: var(--primary);
      background: linear-gradient(180deg, #fdfbff 0%, #ffffff 100%);
    }
    .plan-card.featured::before {
      content: "Most popular";
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: white;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: .8rem;
      padding: .35rem .85rem;
      border-radius: 9999px;
      letter-spacing: .02em;
    }
    .plan-name {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: .25rem;
    }
    .plan-tag { color: var(--muted-fg); font-size: .9rem; margin-bottom: 1.25rem; }
    .plan-price {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--foreground);
      margin-bottom: 1.5rem;
    }
    .plan-price small { font-size: .9rem; color: var(--muted-fg); font-weight: 500; }
    .plan-features {
      list-style: none;
      padding: 0;
      margin: 0 0 1.75rem;
      flex: 1;
    }
    .plan-features li {
      padding: .5rem 0;
      display: flex;
      gap: .55rem;
      align-items: flex-start;
      font-size: .95rem;
      line-height: 1.4;
    }
    .plan-features li.no { color: var(--muted-fg); text-decoration: line-through; opacity: .65; }
    .plan-features .icon {
      flex-shrink: 0;
      width: 18px; height: 18px;
      margin-top: 2px;
    }
    .plan-cta { width: 100%; padding: .85rem 1rem; }
    .pricing-foot {
      text-align: center;
      margin-top: 3rem;
      color: var(--muted-fg);
      font-size: .9rem;
    }
    .pricing-foot a { color: var(--primary); font-weight: 600; }

    /* Modal */
    .pc-modal-back {
      position: fixed; inset: 0;
      background: rgba(30, 27, 75, .55);
      display: none;
      align-items: center; justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .pc-modal-back.show { display: flex; }
    .pc-modal {
      background: var(--card);
      border-radius: var(--radius);
      max-width: 440px;
      width: 100%;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(30,27,75,.25);
    }
    .pc-modal h3 { font-size: 1.4rem; margin-bottom: .75rem; color: var(--primary); }
    .pc-modal p { color: var(--muted-fg); margin-bottom: 1.5rem; line-height: 1.5; }
    .pc-modal .btn { width: 100%; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo" aria-label="CartoonCare home">
      <img src="/images/cartooncare-logo.svg" alt="CartoonCare" class="nav-logo-img" />
    </a>
    <div class="nav-auth" id="nav-auth"></div>
  </div>
</nav>

<main class="pricing-wrap">
  <div class="pricing-head">
    <h1>Choose your <span class="gradient-text-multi">adventure plan</span></h1>
    <p>Magical stories for every brave kid — pick the plan that fits.</p>
  </div>

  <div class="plans-grid" id="plans-grid"></div>

  <div class="pricing-foot">
    Questions about a plan? <a href="/feedback">Get in touch</a>.
  </div>
</main>

<div class="pc-modal-back" id="cta-modal">
  <div class="pc-modal">
    <h3 id="modal-title">Coming soon</h3>
    <p id="modal-body"></p>
    <button class="btn btn-primary" id="modal-close">Got it</button>
  </div>
</div>

<script src="/js/pricing.js"></script>
</body>
</html>
